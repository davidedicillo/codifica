[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "codifica"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "authlib==1.8.0", "httpx==0.28.1", "itsdangerous==2.2.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[project.scripts]
codifica-agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["server*", "agent*"]

[tool.setuptools.package-data]
server = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
